name: CI — Build & Deploy Services

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: api-gateway
            port: 8080
            ec2_tag: gateway
          - service: user-service
            port: 8081
            ec2_tag: user
          - service: product-service
            port: 8082
            ec2_tag: product
          - service: order-service
            port: 8083
            ec2_tag: order
          - service: notification-service
            port: 8084
            ec2_tag: notification

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shop-${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/shop-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-and-push
    strategy:
      matrix:
        include:
          - service: api-gateway
            port: 8080
            ec2_tag: gateway
          - service: user-service
            port: 8081
            ec2_tag: user
          - service: product-service
            port: 8082
            ec2_tag: product
          - service: order-service
            port: 8083
            ec2_tag: order
          - service: notification-service
            port: 8084
            ec2_tag: notification

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve SQS queue URL
        id: sqs
        run: |
          QUEUE_URL=$(aws sqs get-queue-url \
            --queue-name shop-dev-orders \
            --region eu-central-1 \
            --query QueueUrl --output text)
          echo "queue_url=$QUEUE_URL" >> $GITHUB_OUTPUT
          echo "SQS queue: $QUEUE_URL"

      - name: Get instance ID for ${{ matrix.ec2_tag }}
        id: get_instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --region eu-central-1 \
            --filters \
              "Name=tag:Project,Values=shop" \
              "Name=tag:Service,Values=${{ matrix.ec2_tag }}" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Found: $INSTANCE_ID for ${{ matrix.ec2_tag }}"

      - name: Wait for SSM agent
        run: |
          for i in $(seq 1 12); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ steps.get_instance.outputs.instance_id }}" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "None")
            echo "Attempt $i: SSM = $STATUS"
            [ "$STATUS" = "Online" ] && break
            sleep 10
          done

      - name: Get internal IPs for service wiring
        id: get_ips
        run: |
          USER_IP=$(aws ec2 describe-instances \
            --region eu-central-1 \
            --filters "Name=tag:Service,Values=user" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PrivateIpAddress" --output text)
          PRODUCT_IP=$(aws ec2 describe-instances \
            --region eu-central-1 \
            --filters "Name=tag:Service,Values=product" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PrivateIpAddress" --output text)
          ORDER_IP=$(aws ec2 describe-instances \
            --region eu-central-1 \
            --filters "Name=tag:Service,Values=order" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].PrivateIpAddress" --output text)
          echo "user_ip=$USER_IP" >> $GITHUB_OUTPUT
          echo "product_ip=$PRODUCT_IP" >> $GITHUB_OUTPUT
          echo "order_ip=$ORDER_IP" >> $GITHUB_OUTPUT

      - name: Deploy ${{ matrix.service }} via SSM
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/shop-${{ matrix.service }}:${{ github.sha }}"
          PORT="${{ matrix.port }}"
          SERVICE="${{ matrix.service }}"
          DB_URL="jdbc:postgresql://${{ secrets.RDS_ENDPOINT }}/shopdb"
          SQS_URL="${{ steps.sqs.outputs.queue_url }}"

          # Variáveis de ambiente específicas por serviço
          EXTRA_ENV=""
          if [ "$SERVICE" = "order-service" ]; then
            EXTRA_ENV="-e USER_SERVICE_URL=http://${{ steps.get_ips.outputs.user_ip }}:8081 -e PRODUCT_SERVICE_URL=http://${{ steps.get_ips.outputs.product_ip }}:8082 -e SQS_QUEUE_URL=${SQS_URL}"
          fi
          if [ "$SERVICE" = "notification-service" ]; then
            EXTRA_ENV="-e SQS_QUEUE_URL=${SQS_URL}"
          fi
          if [ "$SERVICE" = "api-gateway" ]; then
            EXTRA_ENV="-e USER_SERVICE_URL=http://${{ steps.get_ips.outputs.user_ip }}:8081 -e PRODUCT_SERVICE_URL=http://${{ steps.get_ips.outputs.product_ip }}:8082 -e ORDER_SERVICE_URL=http://${{ steps.get_ips.outputs.order_ip }}:8083"
          fi

          # Serviços sem DB não precisam de SPRING_DATASOURCE_*
          DB_ENV=""
          if [ "$SERVICE" != "notification-service" ]; then
            DB_ENV="-e SPRING_DATASOURCE_URL=${DB_URL} -e SPRING_DATASOURCE_USERNAME=shopuser -e SPRING_DATASOURCE_PASSWORD=${{ secrets.RDS_PASSWORD }}"
          fi

          # Construir o comando docker run como string simples (evita problemas de
          # escaping de aspas dentro do JSON do SSM)
          DOCKER_CMD="docker run -d --name ${SERVICE} --restart always -p ${PORT}:${PORT} -e SPRING_PROFILES_ACTIVE=docker -e AWS_REGION=eu-central-1 ${DB_ENV} ${EXTRA_ENV} ${IMAGE}"

          # Passar cada comando como elemento do array JSON usando jq
          # jq garante escaping correto independentemente do conteúdo das variáveis
          PARAMS=$(jq -n \
            --arg pull "docker pull ${IMAGE}" \
            --arg stop "docker stop ${SERVICE} 2>/dev/null || true" \
            --arg rm   "docker rm ${SERVICE} 2>/dev/null || true" \
            --arg run  "$DOCKER_CMD" \
            '{commands: [
              "dnf install -y docker",
              "systemctl start docker",
              "systemctl enable docker",
              $pull,
              $stop,
              $rm,
              $run
            ]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.get_instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --region eu-central-1 \
            --query "Command.CommandId" \
            --output text)

          for i in $(seq 1 18); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ steps.get_instance.outputs.instance_id }}" \
              --region eu-central-1 \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i: $STATUS"
            [ "$STATUS" = "Success" ] && break
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ steps.get_instance.outputs.instance_id }}" \
                --region eu-central-1 \
                --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 10
          done
