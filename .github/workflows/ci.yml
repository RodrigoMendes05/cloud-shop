name: CI — Build & Deploy Hello World

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./services/hello-world
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shop-hello-world:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/shop-hello-world:latest

  deploy:
    name: Deploy via SSM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get gateway instance ID
        id: get_instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --region eu-central-1 \
            --filters \
              "Name=tag:Project,Values=shop" \
              "Name=tag:Service,Values=gateway" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "Found instance: $INSTANCE_ID"

      - name: Wait for SSM agent to be ready
        run: |
          echo "Waiting for SSM agent on ${{ steps.get_instance.outputs.instance_id }}..."
          for i in $(seq 1 12); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ steps.get_instance.outputs.instance_id }}" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "None")
            echo "Attempt $i: SSM status = $STATUS"
            if [ "$STATUS" = "Online" ]; then
              echo "SSM agent is online!"
              break
            fi
            sleep 10
          done

      - name: Deploy via SSM Run Command
        run: |
          IMAGE_TAG="${{ secrets.DOCKERHUB_USERNAME }}/shop-hello-world:${{ github.sha }}"
          echo "Deploying image: $IMAGE_TAG"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.get_instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[
              \"dnf install -y docker\",
              \"systemctl start docker\",
              \"systemctl enable docker\",
              \"docker pull ${IMAGE_TAG}\",
              \"docker stop hello-world 2>/dev/null || true\",
              \"docker rm hello-world 2>/dev/null || true\",
              \"docker run -d --name hello-world --restart always -p 80:80 ${IMAGE_TAG}\"
            ]}" \
            --region eu-central-1 \
            --query "Command.CommandId" \
            --output text)

          echo "Command ID: $COMMAND_ID"

          for i in $(seq 1 18); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ steps.get_instance.outputs.instance_id }}" \
              --region eu-central-1 \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i: Command status = $STATUS"
            if [ "$STATUS" = "Success" ]; then
              echo "Deploy successful!"
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              echo "Deploy failed with status: $STATUS"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ steps.get_instance.outputs.instance_id }}" \
                --region eu-central-1 \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            sleep 10
          done
