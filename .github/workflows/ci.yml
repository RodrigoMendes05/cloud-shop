name: CI — Build & Deploy Services

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  pull-requests: write   # necessário para comentar o plano no PR

jobs:
  # ─────────────────────────────────────────────────────────────────
  # JOB 1 — Lint Terraform (corre em PR e em push main)
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: Terraform Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: terraform fmt check
        working-directory: infrastructure/terraform/enviroments/dev
        run: terraform fmt -check -recursive

      - name: Install tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint init
        working-directory: infrastructure/terraform/enviroments/dev
        run: tflint --init

      - name: tflint run
        working-directory: infrastructure/terraform/enviroments/dev
        run: tflint --format compact

  # ─────────────────────────────────────────────────────────────────
  # JOB 2 — Secret scan (gitleaks) — corre em PR e push main
  # ─────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # histórico completo para o gitleaks

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────
  # JOB 3 — Terraform Plan (só em pull_request; comenta no PR)
  # ─────────────────────────────────────────────────────────────────
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [lint, secret-scan]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        working-directory: infrastructure/terraform/enviroments/dev
        run: terraform init -input=false

      - name: Terraform Plan
        id: plan
        working-directory: infrastructure/terraform/enviroments/dev
        # db_password não é aplicado em plan — só precisamos de passar algo
        # para satisfazer a variável obrigatória; o valor real vem do SSM
        run: |
          terraform plan -input=false \
            -var="db_password=PLACEHOLDER_NOT_APPLIED" \
            -no-color \
            -out=tfplan 2>&1 | tee plan_output.txt
          echo "exitcode=$?" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infrastructure/terraform/enviroments/dev/plan_output.txt', 'utf8');
            const maxLen = 60000;
            const truncated = plan.length > maxLen
              ? plan.slice(0, maxLen) + '\n\n... (truncado — ver run completo)'
              : plan;

            const body = `## Terraform Plan

            <details><summary>Ver output completo</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`

            </details>

            > Gerado por commit \`${{ github.sha }}\` em \`${{ github.ref }}\``;

            // Apaga comentários anteriores do bot para não acumular
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments) {
              if (c.user.type === 'Bot' && c.body.includes('## Terraform Plan')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail if plan failed
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1

  # ─────────────────────────────────────────────────────────────────
  # JOB 4 — Terraform Apply (só em push main, depois de lint+scan)
  # ─────────────────────────────────────────────────────────────────
  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [lint, secret-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"

      - name: Terraform Init
        working-directory: infrastructure/terraform/enviroments/dev
        run: terraform init -input=false

      - name: Fetch db_password from SSM
        id: secrets
        run: |
          DB_PASS=$(aws ssm get-parameter \
            --name "/shop/dev/rds/password" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)
          # Mascarar na log do Actions
          echo "::add-mask::$DB_PASS"
          echo "db_password=$DB_PASS" >> $GITHUB_OUTPUT

      - name: Terraform Apply
        working-directory: infrastructure/terraform/enviroments/dev
        run: |
          terraform apply -auto-approve -input=false \
            -var="db_password=${{ steps.secrets.outputs.db_password }}"

  # ─────────────────────────────────────────────────────────────────
  # JOB 5 — Build & Push Docker images (só em push main)
  # ─────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - service: api-gateway
            port: 8080
            ec2_tag: gateway
          - service: user-service
            port: 8081
            ec2_tag: user
          - service: product-service
            port: 8082
            ec2_tag: product
          - service: order-service
            port: 8083
            ec2_tag: order
          - service: notification-service
            port: 8084
            ec2_tag: notification

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/shop-${{ matrix.service }}:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/shop-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ─────────────────────────────────────────────────────────────────
  # JOB 6 — Deploy via SSM (só em push main, após build)
  # ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - service: api-gateway
            port: 8080
            ec2_tag: gateway
          - service: user-service
            port: 8081
            ec2_tag: user
          - service: product-service
            port: 8082
            ec2_tag: product
          - service: order-service
            port: 8083
            ec2_tag: order
          - service: notification-service
            port: 8084
            ec2_tag: notification

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve SQS queue URL
        id: sqs
        run: |
          QUEUE_URL=$(aws sqs get-queue-url \
            --queue-name shop-dev-orders \
            --region eu-central-1 \
            --query QueueUrl --output text)
          echo "queue_url=$QUEUE_URL" >> $GITHUB_OUTPUT

      - name: Get instance ID for ${{ matrix.ec2_tag }}
        id: get_instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --region eu-central-1 \
            --filters \
              "Name=tag:Project,Values=shop" \
              "Name=tag:Service,Values=${{ matrix.ec2_tag }}" \
              "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT

      - name: Wait for SSM agent
        run: |
          for i in $(seq 1 12); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=${{ steps.get_instance.outputs.instance_id }}" \
              --query "InstanceInformationList[0].PingStatus" \
              --output text 2>/dev/null || echo "None")
            echo "Attempt $i: SSM = $STATUS"
            [ "$STATUS" = "Online" ] && break
            sleep 10
          done

      - name: Get internal IPs for service wiring
        id: get_ips
        run: |
          for svc in user product order; do
            IP=$(aws ec2 describe-instances \
              --region eu-central-1 \
              --filters "Name=tag:Service,Values=$svc" "Name=instance-state-name,Values=running" \
              --query "Reservations[0].Instances[0].PrivateIpAddress" --output text)
            echo "${svc}_ip=$IP" >> $GITHUB_OUTPUT
          done

      - name: Deploy ${{ matrix.service }} via SSM
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/shop-${{ matrix.service }}:${{ github.sha }}"
          PORT="${{ matrix.port }}"
          SERVICE="${{ matrix.service }}"
          # Endpoint RDS lido de GitHub Secret (não é a password — só o host:porta)
          DB_URL="jdbc:postgresql://${{ secrets.RDS_ENDPOINT }}/shopdb"
          SQS_URL="${{ steps.sqs.outputs.queue_url }}"
          # Nome do parâmetro SSM que guarda a password — a EC2 vai buscá-lo em runtime
          SSM_PARAM_NAME="/shop/dev/rds/password"

          # Variáveis específicas por serviço
          EXTRA_ENV=""
          if [ "$SERVICE" = "order-service" ]; then
            EXTRA_ENV="-e USER_SERVICE_URL=http://${{ steps.get_ips.outputs.user_ip }}:8081 -e PRODUCT_SERVICE_URL=http://${{ steps.get_ips.outputs.product_ip }}:8082 -e SQS_QUEUE_URL=${SQS_URL}"
          fi
          if [ "$SERVICE" = "notification-service" ]; then
            EXTRA_ENV="-e SQS_QUEUE_URL=${SQS_URL}"
          fi
          if [ "$SERVICE" = "api-gateway" ]; then
            EXTRA_ENV="-e USER_SERVICE_URL=http://${{ steps.get_ips.outputs.user_ip }}:8081 -e PRODUCT_SERVICE_URL=http://${{ steps.get_ips.outputs.product_ip }}:8082 -e ORDER_SERVICE_URL=http://${{ steps.get_ips.outputs.order_ip }}:8083"
          fi

          # Serviços com DB: a EC2 lê a password do SSM em runtime via aws cli
          # e passa-a como variável de ambiente ao container — nunca viaja pelo pipeline
          DB_ENV=""
          if [ "$SERVICE" != "notification-service" ] && [ "$SERVICE" != "api-gateway" ]; then
            DB_ENV="-e SPRING_DATASOURCE_URL=${DB_URL} -e SPRING_DATASOURCE_USERNAME=shopuser"
            # O comando SSM vai buscar a password ao SSM Parameter Store localmente na EC2
            FETCH_PASS="DB_PASS=\$(aws ssm get-parameter --name ${SSM_PARAM_NAME} --with-decryption --region eu-central-1 --query Parameter.Value --output text)"
            DB_ENV_PASS="-e SPRING_DATASOURCE_PASSWORD=\$DB_PASS"
          fi

          # Construir o docker run
          DOCKER_CMD="docker run -d --name ${SERVICE} --restart always -p ${PORT}:${PORT} -e SPRING_PROFILES_ACTIVE=docker -e AWS_REGION=eu-central-1 ${DB_ENV} ${DB_ENV_PASS:-} ${EXTRA_ENV} ${IMAGE}"

          # Se o serviço precisa de DB, prepend o fetch da password
          if [ -n "${FETCH_PASS:-}" ]; then
            RUN_CMD="${FETCH_PASS} && ${DOCKER_CMD}"
          else
            RUN_CMD="${DOCKER_CMD}"
          fi

          PARAMS=$(jq -n \
            --arg pull  "docker pull ${IMAGE}" \
            --arg stop  "docker stop ${SERVICE} 2>/dev/null || true" \
            --arg rm    "docker rm ${SERVICE} 2>/dev/null || true" \
            --arg run   "$RUN_CMD" \
            '{commands: [
              "#!/bin/bash",
              "dnf install -y docker",
              "systemctl start docker",
              "systemctl enable docker",
              $pull,
              $stop,
              $rm,
              $run
            ]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.get_instance.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$PARAMS" \
            --region eu-central-1 \
            --query "Command.CommandId" \
            --output text)

          for i in $(seq 1 18); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ steps.get_instance.outputs.instance_id }}" \
              --region eu-central-1 \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Attempt $i: $STATUS"
            [ "$STATUS" = "Success" ] && break
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ steps.get_instance.outputs.instance_id }}" \
                --region eu-central-1 \
                --query "StandardErrorContent" --output text
              exit 1
            fi
            sleep 10
          done
