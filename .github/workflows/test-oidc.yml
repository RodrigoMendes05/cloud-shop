name: Test OIDC Connection

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-aws-auth:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: List buckets
        run: aws s3api list-buckets --query "Buckets[].Name" --output text

      - name: Verify DynamoDB lock table exists
        run: aws dynamodb describe-table --table-name shop-tf-locks --region eu-central-1 --query "Table.TableStatus"
