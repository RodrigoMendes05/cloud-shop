---
- name: Deploy Hello World container
  hosts: gateway
  become: true

  tasks:
    - name: Install Docker
      dnf:
        name: docker
        state: present

    - name: Start and enable Docker service
      service:
        name: docker
        state: started
        enabled: true

    - name: Add ec2-user to docker group
      user:
        name: ec2-user
        groups: docker
        append: true

    - name: Pull hello-world image
      community.docker.docker_image:
        name: "{{ docker_image }}"
        source: pull

    - name: Run hello-world container
      community.docker.docker_container:
        name: hello-world
        image: "{{ docker_image }}"
        state: started
        restart_policy: always
        ports:
          - "80:80"