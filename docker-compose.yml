version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shop-postgres
    environment:
      POSTGRES_DB: shopdb
      POSTGRES_USER: shopuser
      POSTGRES_PASSWORD: ShopDev2024!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopuser -d shopdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - shop-network

  user-service:
    build:
      context: ./services/user-service
    container_name: shop-user-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopdb
      SPRING_DATASOURCE_USERNAME: shopuser
      SPRING_DATASOURCE_PASSWORD: ShopDev2024!
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shop-network

  product-service:
    build:
      context: ./services/product-service
    container_name: shop-product-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopdb
      SPRING_DATASOURCE_USERNAME: shopuser
      SPRING_DATASOURCE_PASSWORD: ShopDev2024!
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - shop-network

  order-service:
    build:
      context: ./services/order-service
    container_name: shop-order-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shopdb
      SPRING_DATASOURCE_USERNAME: shopuser
      SPRING_DATASOURCE_PASSWORD: ShopDev2024!
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      # SQS_QUEUE_URL não definido → SqsPublisher usa "disabled" por defeito
      # Para testar com SQS real localmente: adiciona SQS_QUEUE_URL=<url> aqui
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
      product-service:
        condition: service_started
    networks:
      - shop-network

  notification-service:
    build:
      context: ./services/notification-service
    container_name: shop-notification-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # SQS_QUEUE_URL não definido → consumidor desactivado localmente
      # Para testar com SQS real: adiciona SQS_QUEUE_URL=<url> aqui
    depends_on:
      - order-service
    networks:
      - shop-network

  api-gateway:
    build:
      context: ./services/api-gateway
    container_name: shop-api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
    depends_on:
      - user-service
      - product-service
      - order-service
    networks:
      - shop-network

volumes:
  postgres_data:

networks:
  shop-network:
    driver: bridge