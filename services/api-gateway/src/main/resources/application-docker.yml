services:
  user:
    url: ${USER_SERVICE_URL:http://user-service:8081}
  product:
    url: ${PRODUCT_SERVICE_URL:http://product-service:8082}
  order:
    url: ${ORDER_SERVICE_URL:http://order-service:8083}
spring:
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://user-service:8081}
          predicates:
            - Path=/api/users/**
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://product-service:8082}
          predicates:
            - Path=/api/products/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://order-service:8083}
          predicates:
            - Path=/api/orders/**
