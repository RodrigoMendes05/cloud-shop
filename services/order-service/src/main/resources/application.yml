server:
  port: 8083

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:h2:mem:orderdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# AWS / SQS — disabled by default in local dev (sem AWS credentials locais)
# Activado no profile docker via application-docker.yml
aws:
  region: eu-central-1
  sqs:
    queue-url: disabled   # "disabled" faz o SqsPublisher saltar o envio

# Feign Client Configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Service URLs (for Feign clients)
services:
  user:
    url: http://localhost:8081
  product:
    url: http://localhost:8082
